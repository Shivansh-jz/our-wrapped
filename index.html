<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover lets the site fill phones with notches -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Wrapped</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Progress bars (one per slide) are created by js/app.js -->
  <div id="bars" aria-hidden="true"></div>
  <!-- Slides are created by js/app.js from js/config.js -->
  <main id="stage"></main>
  <!-- Invisible tap zones: left = back, right = next -->
  <button id="prev" aria-label="Previous"></button>
  <button id="next" aria-label="Next"></button>
  <div id="hearts" aria-hidden="true"></div>

  <script src="js/config.js"></script>  <!-- YOUR DATA: edit this file -->
  <script src="js/app.js"></script>     <!-- the engine: no need to edit -->
</body>
</html>
